<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAMZ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1120;
    --bg-elevated:#171B2E;
    --bg-elevated-2:#1D2238;
    --flame-1:#FF6A3D;
    --flame-2:#D6274B;
    --cyan:#43CFEA;
    --gold:#FFC94D;
    --text:#F3F4F8;
    --text-dim:#98A0B8;
    --text-faint:#666E8A;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --success:#4ADE80;
    --danger:#FF5C6C;
    --radius-lg:18px;
    --radius-md:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,106,61,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(67,207,234,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  #app{ max-width:1080px; margin:0 auto; padding:0 20px 80px; }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand__mark{
    width:42px; height:42px; border-radius:11px;
    background:linear-gradient(135deg, var(--flame-1), var(--flame-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:#fff;
    box-shadow:0 4px 14px rgba(214,39,75,0.35);
    overflow:hidden; flex-shrink:0;
  }
  .brand__mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand__name{ font-size:20px; letter-spacing:0.03em; }
  .brand__name span{ color:var(--flame-1); }
  .admin-entry{
    background:transparent; border:1px solid var(--border);
    color:var(--text-dim); font-size:12.5px; padding:8px 14px;
    border-radius:100px; transition:all .15s;
  }
  .admin-entry:hover{ border-color:var(--border-strong); color:var(--text); }

  /* ---------- Hero ---------- */
  .hero{ padding:18px 0 30px; }
  .hero__eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12px; color:var(--cyan); text-transform:uppercase;
    letter-spacing:0.14em; font-weight:600; margin-bottom:12px;
  }
  .hero__eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .hero h1{ font-size:clamp(30px, 5vw, 44px); line-height:1.05; margin-bottom:12px; }
  .hero h1 .flame{
    background:linear-gradient(90deg, var(--flame-1), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ color:var(--text-dim); font-size:15.5px; max-width:520px; line-height:1.6; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:8px; margin:26px 0 20px; border-bottom:1px solid var(--border); }
  .tab{
    background:none; border:none; color:var(--text-faint);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px;
    letter-spacing:0.02em; padding:10px 4px 14px; position:relative;
    margin-right:22px;
  }
  .tab.active{ color:var(--text); }
  .tab.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px;
    border-radius:3px 3px 0 0;
    background:linear-gradient(90deg, var(--flame-1), var(--gold));
  }
  .tab__count{ color:var(--text-faint); font-family:'Plus Jakarta Sans'; font-weight:600; font-size:12px; }

  /* ---------- Grid & Ticket cards ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:16px; margin-top:6px; }

  .ticket{
    position:relative;
    background:linear-gradient(165deg, var(--bg-elevated), var(--bg-elevated-2));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 18px 16px;
    display:flex; flex-direction:column; gap:12px;
    transition:transform .15s, border-color .15s;
  }
  .ticket:hover{ transform:translateY(-3px); border-color:var(--border-strong); }
  .ticket__badge{
    position:absolute; top:14px; right:14px;
    font-size:10.5px; font-weight:700; letter-spacing:0.05em;
    color:var(--bg); background:var(--gold); padding:3px 8px; border-radius:100px;
  }
  .ticket__icon{
    width:44px; height:44px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; font-size:21px;
    background:linear-gradient(135deg, rgba(255,106,61,0.18), rgba(67,207,234,0.14));
    border:1px solid var(--border);
  }
  .ticket__media{
    width:100%; aspect-ratio:3/4; border-radius:12px; overflow:hidden;
    background:linear-gradient(135deg, rgba(255,106,61,0.12), rgba(67,207,234,0.10));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .ticket__media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ticket__media-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--text-faint); font-size:11px; text-align:center; padding:10px;
  }
  .ticket__media-empty svg{ width:26px; height:26px; opacity:0.5; }
  .ticket--clickable{ cursor:pointer; }
  .ticket__title{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; }
  .ticket__sub{ color:var(--text-faint); font-size:12.5px; }
  .ticket__perf{
    position:relative;
    border-top:2px dashed var(--border-strong);
    margin:2px -18px 0;
  }
  .ticket__perf::before, .ticket__perf::after{
    content:''; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%;
    background:var(--bg);
  }
  .ticket__perf::before{ left:-9px; }
  .ticket__perf::after{ right:-9px; }
  .ticket__bottom{ display:flex; align-items:center; justify-content:space-between; padding-top:10px; }
  .ticket__price{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--gold); }
  .ticket__buy{
    background:linear-gradient(90deg, var(--flame-1), var(--flame-2));
    border:none; color:#fff; font-weight:700; font-size:13px;
    padding:9px 16px; border-radius:10px; letter-spacing:0.02em;
    box-shadow:0 6px 16px rgba(214,39,75,0.25);
  }
  .ticket__buy:hover{ filter:brightness(1.08); }
  .ticket__desc{ color:var(--text-dim); font-size:13px; line-height:1.5; }

  .empty-state{
    border:1px dashed var(--border-strong); border-radius:var(--radius-lg);
    padding:40px 20px; text-align:center; color:var(--text-faint); font-size:14px;
  }

  /* ---------- Checkout / Payment panel ---------- */
  .panel{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:26px; max-width:520px; margin:10px auto 0;
  }
  .panel__back{ background:none; border:none; color:var(--text-faint); font-size:13px; margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .panel__back:hover{ color:var(--text); }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:10px; padding:11px 13px; color:var(--text); font-size:14px; font-family:inherit;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--cyan); }
  .field__hint{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; color:var(--text-dim); }
  .summary-row.total{ color:var(--text); font-weight:700; font-size:16px; border-top:1px solid var(--border); margin-top:6px; padding-top:12px; }
  .summary-row.total .amt{ color:var(--gold); }
  .btn-primary{
    width:100%; background:linear-gradient(90deg, var(--flame-1), var(--flame-2));
    border:none; color:#fff; font-weight:700; font-size:14.5px; padding:14px;
    border-radius:12px; margin-top:6px; box-shadow:0 8px 20px rgba(214,39,75,0.28);
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; filter:none; }
  .btn-secondary{
    width:100%; background:transparent; border:1px solid var(--border-strong);
    color:var(--text); font-weight:600; font-size:14px; padding:12px; border-radius:12px;
  }
  .error-text{ color:var(--danger); font-size:12.5px; margin-top:6px; }

  /* Boarding-pass order summary at payment */
  .boarding{
    background:var(--bg); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .boarding__row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .boarding__label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; }
  .boarding__val{ font-size:13.5px; font-weight:600; }
  .boarding__code{ color:var(--cyan); }

  .qris-box{
    background:#fff; border-radius:14px; padding:18px; display:flex; flex-direction:column;
    align-items:center; gap:10px; margin-bottom:18px;
  }
  .qris-box img{ width:100%; max-width:230px; border-radius:6px; }
  .qris-placeholder{
    width:100%; max-width:230px; aspect-ratio:1; border-radius:6px;
    background:
      repeating-linear-gradient(0deg, #111 0 8px, #fff 8px 16px),
      repeating-linear-gradient(90deg, #111 0 8px, #fff 8px 16px);
    background-blend-mode:multiply; opacity:0.85;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#111; font-size:11.5px; font-weight:700; padding:14px;
  }
  .qris-caption{ color:#333; font-size:12px; font-weight:600; }

  .wa-note{
    display:flex; gap:10px; align-items:flex-start; background:rgba(67,207,234,0.08);
    border:1px solid rgba(67,207,234,0.22); border-radius:12px; padding:12px 14px; margin-bottom:16px;
    font-size:12.5px; color:var(--text-dim); line-height:1.5;
  }

  .proof-box{
    border:1px dashed var(--border-strong); border-radius:12px; padding:14px; margin-bottom:16px;
  }
  .proof-box__label{ font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:8px; display:block; }
  .proof-empty{
    display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:10px; padding:16px; color:var(--text-faint); font-size:13px; cursor:pointer;
    background:var(--bg);
  }
  .proof-empty:hover{ color:var(--text); }
  .proof-preview{ display:flex; align-items:center; gap:12px; }
  .proof-preview img{ width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--border); }
  .proof-preview__info{ flex:1; font-size:12.5px; color:var(--text-dim); }
  .proof-preview__actions{ display:flex; gap:8px; margin-top:6px; }
  .proof-preview__actions a, .proof-preview__actions button{
    font-size:11.5px; color:var(--cyan); background:none; border:none; padding:0; text-decoration:underline;
  }
  .proof-preview__actions .danger-link{ color:var(--danger); }

  /* ---------- Footer ---------- */
  .footer{
    margin-top:60px; border-top:1px solid var(--border); padding-top:22px;
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
  }
  .footer__cs{ display:flex; align-items:center; gap:10px; }
  .footer__cs-icon{
    width:38px; height:38px; border-radius:10px; background:rgba(74,222,128,0.14);
    border:1px solid rgba(74,222,128,0.3); display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .footer__cs-text b{ display:block; font-size:13.5px; }
  .footer__cs-text span{ font-size:12px; color:var(--text-faint); }
  .footer__cs-link{
    text-decoration:none; background:rgba(74,222,128,0.12); color:var(--success);
    border:1px solid rgba(74,222,128,0.3); font-weight:700; font-size:12.5px;
    padding:9px 15px; border-radius:100px;
  }
  .footer small{ display:block; color:var(--text-faint); font-size:11.5px; margin-top:18px; }

  /* ---------- Modal (admin) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,7,14,0.72); backdrop-filter:blur(3px);
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--bg-elevated); border:1px solid var(--border-strong); border-radius:var(--radius-lg);
    padding:26px; max-width:640px; width:100%; margin-bottom:40px;
  }
  .modal__head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal__close{ background:none; border:none; color:var(--text-faint); font-size:22px; line-height:1; }
  .modal__close:hover{ color:var(--text); }
  .admin-tabs{ display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
  .admin-tab{
    background:var(--bg); border:1px solid var(--border); color:var(--text-dim);
    font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:100px;
  }
  .admin-tab.active{ background:var(--flame-1); border-color:var(--flame-1); color:#fff; }
  .admin-grid-item{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .admin-grid-item .field{ margin-bottom:0; }
  .admin-grid-item .field label{ font-size:10.5px; }
  .product-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .product-row__info b{ display:block; font-size:13.5px; }
  .product-row__info span{ font-size:12px; color:var(--text-faint); }
  .icon-btn{
    background:var(--bg-elevated-2); border:1px solid var(--border); color:var(--text-dim);
    width:30px; height:30px; border-radius:8px; font-size:14px;
  }
  .icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }
  .icon-btn:hover{ color:var(--text); }
  .save-bar{ display:flex; gap:10px; margin-top:18px; }
  .save-bar .btn-primary{ margin-top:0; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--success); color:#0E1120; font-weight:700; font-size:13px;
    padding:11px 20px; border-radius:100px; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.3);
  }
  .qris-upload-preview{ width:120px; border-radius:8px; border:1px solid var(--border); margin-top:8px; }
  .item-thumb{
    width:56px; height:56px; border-radius:10px; overflow:hidden; flex-shrink:0;
    background:var(--bg-elevated-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .item-thumb img{ width:100%; height:100%; object-fit:cover; }
  .item-thumb-empty{ font-size:10px; color:var(--text-faint); text-align:center; padding:2px; }
  .thumb-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .thumb-row .field{ margin-bottom:0; flex:1; }

  /* Admin multi-image gallery editor */
  .gallery-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .gallery-thumb{ position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .gallery-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumb__remove{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:12px; line-height:1;
  }
  .gallery-add{
    width:64px; height:64px; border-radius:8px; border:1px dashed var(--border-strong);
    display:flex; align-items:center; justify-content:center; color:var(--text-faint);
    font-size:24px; cursor:pointer; flex-shrink:0;
  }
  .gallery-add:hover{ color:var(--text); border-color:var(--text-dim); }
  .gallery-hint{ font-size:11px; color:var(--text-faint); margin-top:6px; }

  /* Product detail slider modal */
  .pd-modal{ max-width:460px; padding:0; overflow:hidden; }
  .pd-slider{ position:relative; width:100%; aspect-ratio:3/4; background:var(--bg); }
  .pd-slide{ width:100%; height:100%; object-fit:cover; display:block; }
  .pd-slide-empty{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:13px; flex-direction:column; gap:8px;
  }
  .pd-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px;
    border-radius:50%; background:rgba(10,12,20,0.55); border:1px solid rgba(255,255,255,0.15);
    color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .pd-nav--prev{ left:10px; }
  .pd-nav--next{ right:10px; }
  .pd-dots{ position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .pd-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); }
  .pd-dot.active{ background:#fff; width:16px; border-radius:4px; }
  .pd-close{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,12,20,0.6); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .pd-body{ padding:22px; }
  .pd-title{ font-size:22px; margin-bottom:6px; }
  .pd-price{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:21px; color:var(--gold); margin-bottom:14px; }
  .pd-desc{ color:var(--text-dim); font-size:14px; line-height:1.65; margin-bottom:18px; white-space:pre-line; }

  @media(max-width:600px){
    .admin-grid-item{ grid-template-columns:1fr; }
    .topbar{ flex-wrap:wrap; gap:10px; }
  }

  @media(max-width:480px){
    #app{ padding:0 14px 60px; }
    .topbar{ padding:16px 0 14px; }
    .brand__mark{ width:36px; height:36px; font-size:14px; }
    .brand__name{ font-size:17px; }
    .hero{ padding:10px 0 22px; }
    .hero p{ font-size:14px; }
    .tabs{ margin:18px 0 16px; }
    .tab{ font-size:14.5px; margin-right:16px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
    .ticket{ padding:14px 14px 13px; }
    .ticket__title{ font-size:16.5px; }
    .panel{ padding:18px; border-radius:14px; }
    .modal{ padding:18px; border-radius:14px; }
    .modal-backdrop{ padding:16px 10px; align-items:stretch; }
    .admin-tabs{ gap:6px; }
    .admin-tab{ font-size:11.5px; padding:7px 11px; }
    .footer{ flex-direction:column; align-items:flex-start; }
    .footer__cs-link{ align-self:stretch; text-align:center; }
    .qris-box img, .qris-placeholder{ max-width:200px; }
  }

  @media(min-width:1000px){
    .hero p{ font-size:16.5px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================= DATA DEFAULTS ============================= */
const DEFAULT_CONFIG = {
  storeName: 'ADAMZ STORE',

/* ============================= STORAGE (Firebase Realtime Database) =============================
   Cara aktifkan penyimpanan permanen:
   1. Buat project gratis di https://console.firebase.google.com
   2. Buka menu Build > Realtime Database > Create Database (pilih lokasi terdekat)
   3. Pada tab "Rules", pakai:  { "rules": { ".read": true, ".write": true } }  lalu Publish
      (catatan keamanan: siapa pun yang tahu URL database ini bisa membaca & mengubah data,
       cukup aman untuk toko kecil tapi jangan simpan data sensitif di sini)
   4. Salin URL yang muncul di atas tab Data, bentuknya seperti:
      https://nama-project-default-rtdb.asia-southeast1.firebasedatabase.app
   5. Tempel URL itu ke FIREBASE_DB_URL di bawah ini (ganti teks placeholder-nya)
================================================================================================= */
const FIREBASE_DB_URL = 'https://adamz-store-default-rtdb.asia-southeast1.firebasedatabase.app/config';

function firebaseConfigured(){
  return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes('PASTE_URL_FIREBASE');
}

async function fbGet(path){
  const res = await fetch(`${FIREBASE_DB_URL.replace(/\/$/,'')}/${path}.json`);
  if(!res.ok) throw new Error('Gagal memuat data (' + res.status + ')');
  return res.json();
}
async function fbPut(path, value){
  const res = await fetch(`${FIREBASE_DB_URL.replace(/\/$/,'')}/${path}.json`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(value)
  });
  if(!res.ok) throw new Error('Gagal menyimpan (' + res.status + ')');
  return res.json();
}

async function loadData(){
  if(firebaseConfigured()){
    try{
      const cfg = await fbGet('config');
      if(cfg) state.config = { ...DEFAULT_CONFIG, ...cfg };
    }catch(e){ console.warn('Load config gagal:', e); }
    try{
      const dia = await fbGet('diamonds');
      if(dia) state.diamonds = dia;
    }catch(e){ console.warn('Load diamonds gagal:', e); }
    try{
      const prod = await fbGet('products');
      if(prod) state.products = prod;
    }catch(e){ console.warn('Load products gagal:', e); }
  }
  state.loading = false;
  render();
}
async function saveConfig(cfg){
  state.config = cfg;
  if(!firebaseConfigured()) return { persisted:false };
  await fbPut('config', cfg);
  return { persisted:true };
}
async function saveDiamonds(list){
  state.diamonds = list;
  if(!firebaseConfigured()) return { persisted:false };
  await fbPut('diamonds', list);
  return { persisted:true };
}
async function saveProducts(list){
  state.products = list;
  if(!firebaseConfigured()) return { persisted:false };
  await fbPut('products', list);
  return { persisted:true };
}

/* ============================= HELPERS ============================= */
function rupiah(n){ return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function genOrderCode(){
  const t = Date.now().toString().slice(-6);
  const r = Math.floor(100+Math.random()*900);
  return 'ADMZ-' + t + '-' + r;
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=''; render(); }, 3200);
}
function waLink(text){
  return 'https://wa.me/' + state.config.whatsapp + '?text=' + encodeURIComponent(text);
}
function mediaInner(image){
  if(image) return `<img src="${image}" alt="">`;
  return `<div class="ticket__media-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5L3 20"/></svg>
    Belum ada gambar
  </div>`;
}
function fileToCompressedDataUrl(file, maxWidth=520, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Gagal membaca gambar'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('Gagal membaca file'));
    reader.readAsDataURL(file);
  });
}

/* ============================= ACTIONS ============================= */
function clearPaymentProof(){
  if(state.paymentProof && state.paymentProof.previewUrl){
    URL.revokeObjectURL(state.paymentProof.previewUrl);
  }
  state.paymentProof = null;
}
function goCatalog(){ state.view='catalog'; state.selectedItem=null; clearPaymentProof(); render(); }
function selectDiamond(item){
  state.selectedItem = { kind:'diamond', ...item };
  state.form = { gameId:'', nickname:'', qty:1 };
  clearPaymentProof();
  state.view='checkout'; render();
}
function selectProduct(item){
  state.selectedItem = { kind:'product', ...item };
  state.form = { gameId:'', nickname:'', qty:1 };
  clearPaymentProof();
  state.view='checkout'; render();
}
function openProductDetail(product){
  if(!product) return;
  state.productDetail = { product, slide:0 };
  render();
}
function closeProductDetail(){
  state.productDetail = null;
  render();
}
function pdPrev(){
  const total = (state.productDetail.product.images||[]).length || 1;
  state.productDetail.slide = (state.productDetail.slide - 1 + total) % total;
  render();
}
function pdNext(){
  const total = (state.productDetail.product.images||[]).length || 1;
  state.productDetail.slide = (state.productDetail.slide + 1) % total;
  render();
}
function proceedToPayment(){
  if(state.selectedItem.kind==='diamond' && !state.form.gameId.trim()){
    showToast('ID Free Fire wajib diisi');
    return;
  }
  state.orderCode = genOrderCode();
  state.view='payment'; render();
}
function currentTotal(){
  if(!state.selectedItem) return 0;
  if(state.selectedItem.kind==='diamond') return state.selectedItem.price;
  return state.selectedItem.price * (state.form.qty||1);
}
function buildWaMessage(){
  const it = state.selectedItem;
  const lines = [];
  lines.push('Halo Admin ' + state.config.storeName + ', saya ingin konfirmasi pembayaran.');
  lines.push('');
  lines.push('Kode Pesanan: ' + state.orderCode);
  if(it.kind==='diamond'){
    lines.push('Item: ' + it.amount + (it.bonus? ' ('+it.bonus+')':''));
    lines.push('ID Free Fire: ' + state.form.gameId);
    if(state.form.nickname) lines.push('Nickname: ' + state.form.nickname);
  }else{
    lines.push('Item: ' + it.name);
    lines.push('Jumlah: ' + state.form.qty);
  }
  lines.push('Total: ' + rupiah(currentTotal()));
  lines.push('');
  lines.push('Saya sudah melakukan pembayaran via QRIS. Mohon diproses ya, terima kasih!');
  return lines.join('\n');
}

  return `<div class="grid">${state.diamonds.map(d=>`
    <div class="ticket" data-diamond="${d.id}">
      ${d.bonus? `<div class="ticket__badge">${d.bonus}</div>`:''}
      <div class="ticket__icon">💎</div>
      <div>
        <div class="ticket__title">${d.amount}</div>
        <div class="ticket__sub">Free Fire · Masuk otomatis via ID</div>
      </div>
      <div class="ticket__perf"></div>
      <div class="ticket__bottom">
        <div class="ticket__price">${rupiah(d.price)}</div>
        <button class="ticket__buy" data-diamond="${d.id}">Beli</button>

function renderProductGrid(){
  if(!state.products.length) return `<div class="empty-state">Belum ada produk lain. Tambahkan lewat panel admin.</div>`;
  return `<div class="grid">${state.products.map(p=>`
    <div class="ticket ticket--clickable" data-product-card="${p.id}">
      <div class="ticket__media">${mediaInner((p.images && p.images[0]) || '')}</div>
      <div>
        <div class="ticket__title">${p.name}</div>
        <div class="ticket__desc">${p.desc||''}</div>
      </div>
      <div class="ticket__perf"></div>
      <div class="ticket__bottom">
        <div class="ticket__price">${rupiah(p.price)}</div>
        <button class="ticket__buy" data-product="${p.id}">Beli</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function bindCatalogEvents(){
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });
  document.querySelectorAll('[data-diamond]').forEach(b=>{
    b.onclick = ()=>{ selectDiamond(state.diamonds.find(d=>d.id===b.dataset.diamond)); };
  });
  document.querySelectorAll('[data-product-card]').forEach(card=>{
    card.onclick = ()=>{ openProductDetail(state.products.find(p=>p.id===card.dataset.productCard)); };
  });
  document.querySelectorAll('[data-product]').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      selectProduct(state.products.find(p=>p.id===b.dataset.product));
    };
  });
}

      <div class="proof-box">
        <label class="proof-box__label">Bukti Transfer (opsional, tapi disarankan)</label>

          <div class="proof-preview">
            <img src="${proof.previewUrl}" alt="Bukti transfer">
            <div class="proof-preview__info">
              ${proof.file.name}
              <div class="proof-preview__actions">
                <a href="${proof.previewUrl}" download="bukti-${state.orderCode}.jpg">Unduh foto</a>

              </div>
            </div>
          </div>
        ` : `
          <label class="proof-empty">

          </label>
        `}

          ? 'Tekan tombol di bawah untuk mengirim foto bukti dan rincian pesanan ke WhatsApp admin. Di HP, akan muncul menu bagikan — pilih WhatsApp. Kalau menu itu tidak muncul (biasanya di laptop), WhatsApp akan terbuka dengan teks pesanan saja — lampirkan foto secara manual di sana, atau pakai tombol "Unduh foto" di atas dulu.'
          : 'Setelah transfer, unggah foto bukti di atas lalu tekan tombol di bawah supaya foto dan rincian pesanan sama-sama sampai ke admin. Boleh juga dilewati dan kirim teks pesanan saja.'}
      </div>

      <button class="btn-primary" id="btn-send-wa">
        ${proof ? 'Kirim Bukti & Pesanan via WhatsApp' : 'Saya Sudah Bayar — Lanjutkan ke WhatsApp'}
      </button>
    </div>
  `;
}

async function sendToWhatsApp(){
  const text = buildWaMessage();
  const proof = state.paymentProof;

  if(proof && navigator.share && navigator.canShare && navigator.canShare({ files:[proof.file] })){
    try{
      await navigator.share({ files:[proof.file], text, title:'Bukti Pembayaran' });
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return; // dibatalkan pengguna, jangan lanjut fallback
      console.warn('Share gagal, fallback ke tautan teks:', err);
    }
  }

  window.open(waLink(text), '_blank', 'noopener');
  if(proof){
    showToast('Foto belum otomatis terkirim — unduh & lampirkan manual di WhatsApp');
  }
}

function bindPaymentEvents(){
  document.getElementById('back-checkout').onclick = ()=>{ state.view='checkout'; render(); };

  const proofInput = document.getElementById('proof-input');
  if(proofInput){
    proofInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      clearPaymentProof();
      state.paymentProof = { file, previewUrl: URL.createObjectURL(file) };
      render();
    };
  }
  const proofRemove = document.getElementById('proof-remove');
  if(proofRemove){
    proofRemove.onclick = ()=>{ clearPaymentProof(); render(); };
  }
  document.getElementById('btn-send-wa').onclick = sendToWhatsApp;
}

function renderProductDetail(){
  const { product, slide } = state.productDetail;
  const images = product.images || [];
  const hasImages = images.length > 0;
  return `
    <div class="pd-slider">
      <button class="pd-close" id="pd-close">×</button>
      ${hasImages ? `
        <img class="pd-slide" src="${images[slide]}" alt="${product.name}">
        ${images.length>1 ? `
          <button class="pd-nav pd-nav--prev" id="pd-prev">‹</button>
          <button class="pd-nav pd-nav--next" id="pd-next">›</button>
          <div class="pd-dots">${images.map((_,i)=>`<div class="pd-dot ${i===slide?'active':''}"></div>`).join('')}</div>
        ` : ''}
      ` : `
        <div class="pd-slide-empty">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5L3 20"/></svg>

      `}
    </div>
    <div class="pd-body">
      <h2 class="pd-title">${product.name}</h2>
      <div class="pd-price">${rupiah(product.price)}</div>
      <div class="pd-desc">${product.desc || 'Tidak ada keterangan tambahan.'}</div>
      <button class="btn-primary" id="pd-buy">Beli Sekarang</button>
    </div>
  `;
}

function bindProductDetailEvents(){
  document.getElementById('pd-close').onclick = closeProductDetail;
  const prev = document.getElementById('pd-prev');
  const next = document.getElementById('pd-next');
  if(prev) prev.onclick = pdPrev;
  if(next) next.onclick = pdNext;
  document.getElementById('pd-buy').onclick = ()=>{
    const product = state.productDetail.product;
    closeProductDetail();
    selectProduct(product);
  };
}

/* ============================= ADMIN ============================= */
const ADMIN_PASSWORD = 'admin123';

function openAdmin(){
  state.admin.open = true;
  state.admin.pwInput = '';
  if(state.admin.authed){
    state.admin.editConfig = JSON.parse(JSON.stringify(state.config));
    state.admin.editDiamonds = JSON.parse(JSON.stringify(state.diamonds));
    state.admin.editProducts = JSON.parse(JSON.stringify(state.products));
  }
  render();
}
function closeAdmin(){
  state.admin.open = false;
  render();
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!state.admin.open && !state.productDetail && !state.toast){ root.innerHTML=''; return; }

  let modalHtml = '';
  if(state.admin.open){
    modalHtml += `
      <div class="modal-backdrop" id="admin-backdrop">
        <div class="modal" id="admin-modal">
          ${state.admin.authed ? renderAdminPanel() : renderAdminLogin()}
        </div>
      </div>
    `;
  }
  if(state.productDetail){
    modalHtml += `
      <div class="modal-backdrop" id="pd-backdrop">
        <div class="modal pd-modal" id="pd-modal">
          ${renderProductDetail()}
        </div>
      </div>
    `;
  }
  const toastHtml = state.toast ? `<div class="toast">${state.toast}</div>` : '';
  root.innerHTML = modalHtml + toastHtml;

  if(state.admin.open){
    document.getElementById('admin-backdrop').addEventListener('click', (e)=>{
      if(e.target.id==='admin-backdrop') closeAdmin();
    });
    if(!state.admin.authed) bindAdminLoginEvents();
    else bindAdminPanelEvents();
  }
  if(state.productDetail){
    document.getElementById('pd-backdrop').addEventListener('click', (e)=>{
      if(e.target.id==='pd-backdrop') closeProductDetail();
    });
    bindProductDetailEvents();
  }
}

      +<input type="file" accept="image/*" multiple style="display:none;" ${target==='new' ? `id="np-images-input"` : `data-add-img="${target}"`}>

  ` : '';
  return `<div class="gallery-grid">${thumbs}${addTile}</div>`;

function bindAdminPanelEvents(){
  document.getElementById('admin-close').onclick = closeAdmin;
  document.querySelectorAll('.admin-tab').forEach(b=>{
    b.onclick = ()=>{ state.admin.tab = b.dataset.atab; render(); };
  });

  if(state.admin.tab==='store'){
    document.getElementById('ac-logo').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await fileToCompressedDataUrl(file, 300, 0.85);
        state.admin.editConfig.logoImage = dataUrl;
        render();
      }catch(err){ showToast('Gagal memuat logo'); }
    };
    document.getElementById('ac-qris').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ state.admin.editConfig.qrisImage = reader.result; render(); };
      reader.readAsDataURL(file);
    };
    document.getElementById('ac-save').onclick = async ()=>{
      const name = document.getElementById('ac-name').value.trim() || 'ADAMZ STORE';
      const wa = document.getElementById('ac-wa').value.trim().replace(/\D/g,'');
      const newCfg = { ...state.admin.editConfig, storeName:name, whatsapp: wa || state.config.whatsapp };
      try{
        const res = await saveConfig(newCfg);
        showToast(res.persisted ? 'Pengaturan toko tersimpan' : 'Diterapkan sementara — hubungkan FIREBASE_DB_URL dulu supaya tersimpan permanen');
        render();
      }catch(e){
        console.error('Simpan pengaturan gagal:', e);
        showToast('Gagal menyimpan: ' + (e && e.message ? e.message : 'error tidak diketahui'));
      }
    };
  }

  if(state.admin.tab==='diamond'){
    document.querySelectorAll('[data-di]').forEach(inp=>{
      inp.oninput = (e)=>{
        const i = parseInt(e.target.dataset.di);
        const key = e.target.dataset.key;
        state.admin.editDiamonds[i][key] = key==='price' ? Number(e.target.value||0) : e.target.value;
      };
    });
    document.getElementById('ad-save').onclick = async ()=>{
      try{
        const res = await saveDiamonds(state.admin.editDiamonds);
        showToast(res.persisted ? 'Paket diamond tersimpan' : 'Diterapkan sementara — hubungkan FIREBASE_DB_URL dulu supaya tersimpan permanen');
        render();
      }catch(e){
        console.error('Simpan diamond gagal:', e);
        showToast('Gagal menyimpan: ' + (e && e.message ? e.message : 'error tidak diketahui'));
      }
    };
  }

  if(state.admin.tab==='product'){
    document.querySelectorAll('[data-remove-product]').forEach(b=>{
      b.onclick = ()=>{
        const i = parseInt(b.dataset.removeProduct);
        state.admin.editProducts.splice(i,1);
        if(state.admin.editingProductIndex===i) state.admin.editingProductIndex = null;
        render();
      };
    });
    document.querySelectorAll('[data-edit-product]').forEach(b=>{
      b.onclick = ()=>{
        state.admin.editingProductIndex = parseInt(b.dataset.editProduct);
        render();
      };
    });
    document.querySelectorAll('[data-close-edit]').forEach(b=>{
      b.onclick = ()=>{
        state.admin.editingProductIndex = null;
        render();
      };
    });
    document.querySelectorAll('[data-pe]').forEach(inp=>{
      inp.oninput = (e)=>{
        const i = parseInt(e.target.dataset.pe);
        const key = e.target.dataset.pkey;
        state.admin.editProducts[i][key] = key==='price' ? Number(e.target.value||0) : e.target.value;
      };
    });
    document.querySelectorAll('[data-remove-img]').forEach(b=>{
      b.onclick = ()=>{
        const [i, gi] = b.dataset.removeImg.split(':').map(Number);
        state.admin.editProducts[i].images.splice(gi,1);
        render();
      };
    });
    document.querySelectorAll('[data-add-img]').forEach(inp=>{
      inp.onchange = async (e)=>{
        const i = parseInt(e.target.dataset.addImg);
        const files = Array.from(e.target.files || []);
        if(!files.length) return;
        const prod = state.admin.editProducts[i];
        if(!prod.images) prod.images = [];
        const room = 10 - prod.images.length;
        try{
          for(const file of files.slice(0, room)){
            const dataUrl = await fileToCompressedDataUrl(file);
            prod.images.push(dataUrl);
          }
          if(files.length > room) showToast('Maksimal 10 foto per produk');
          render();
        }catch(err){ showToast('Gagal memuat gambar'); }
      };
    });

    if(!state.admin.newProduct) state.admin.newProduct = { name:'', price:'', desc:'', images:[] };
    const npName = document.getElementById('np-name');
    const npPrice = document.getElementById('np-price');
    const npDesc = document.getElementById('np-desc');
    npName.oninput = e=>{ state.admin.newProduct.name = e.target.value; };
    npPrice.oninput = e=>{ state.admin.newProduct.price = e.target.value; };
    npDesc.oninput = e=>{ state.admin.newProduct.desc = e.target.value; };
    document.querySelectorAll('[data-remove-newimg]').forEach(b=>{
      b.onclick = ()=>{
        const gi = parseInt(b.dataset.removeNewimg);
        state.admin.newProduct.images.splice(gi,1);
        render();
      };
    });
    const npImagesInput = document.getElementById('np-images-input');
    if(npImagesInput){
      npImagesInput.onchange = async (e)=>{
        const files = Array.from(e.target.files || []);
        if(!files.length) return;
        if(!state.admin.newProduct.images) state.admin.newProduct.images = [];
        const room = 10 - state.admin.newProduct.images.length;
        try{
          for(const file of files.slice(0, room)){
            const dataUrl = await fileToCompressedDataUrl(file);
            state.admin.newProduct.images.push(dataUrl);
          }
          if(files.length > room) showToast('Maksimal 10 foto per produk');
          render();
        }catch(err){ showToast('Gagal memuat gambar'); }
      };
    }
    document.getElementById('np-add').onclick = ()=>{
      const name = (state.admin.newProduct.name||'').trim();
      const price = Number(state.admin.newProduct.price||0);
      const desc = (state.admin.newProduct.desc||'').trim();
      const images = state.admin.newProduct.images || [];
      if(!name || !price){ showToast('Isi nama & harga produk dulu'); return; }
      state.admin.editProducts.push({ id:'p'+Date.now(), name, price, desc, images });
      state.admin.newProduct = { name:'', price:'', desc:'', images:[] };
      render();
    };
    document.getElementById('ap-save').onclick = async ()=>{
      try{
        const res = await saveProducts(state.admin.editProducts);
        showToast(res.persisted ? 'Produk tersimpan' : 'Diterapkan sementara — hubungkan FIREBASE_DB_URL dulu supaya tersimpan permanen');
        render();
      }catch(e){
        console.error('Simpan produk gagal:', e);
        showToast('Gagal menyimpan: ' + (e && e.message ? e.message : 'error tidak diketahui'));
      }
    };
  }
}

/* ============================= INIT ============================= */
loadData();
</script>
</body>
</html>
